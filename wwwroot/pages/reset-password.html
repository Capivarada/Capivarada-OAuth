<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Redefinir senha — Capivarada</title>
    <link rel="stylesheet" href="/api/static/reset-password.css">
</head>
<body>
    <main class="card">
        <img class="logo" src="/api/static/Logo_Capivarada.png" alt="Capivarada">
        <h1>Redefinir senha</h1>
        <p class="description">Crie uma nova senha para voltar a jogar no Capivarada.</p>

        <form method="POST" action="/api/password/reset">
            <input type="hidden" name="token" value="{{RECOVERY_TOKEN}}">

            <div class="field">
                <label for="password">Nova senha</label>
                <input id="password" type="password" name="password" placeholder="Digite sua nova senha" required minlength="6" autocomplete="new-password">
                <p class="requirements">Mínimo de 6 caracteres.</p>
            </div>

            <div class="field">
                <label for="confirmPassword">Confirmar nova senha</label>
                <input id="confirmPassword" type="password" name="confirmPassword" placeholder="Digite a senha novamente" required minlength="6" autocomplete="new-password">
            </div>

            <button type="submit">ALTERAR SENHA</button>
        </form>

        <p class="footer">Depois de alterar a senha, volte ao Capivarada e faça login normalmente.</p>
    </main>
</body>
</html>
